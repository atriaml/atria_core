[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atria_core"
version = "0.1.8"
description = "Core utilities for Atria projects, including a lightweight and flexible logging submodule and structured data types for document/OCR processing."
readme = "README.md"
requires-python = ">3.13"
license = { file = "LICENSE.txt" }
authors = [{ name = "Saifullah", email = "saifullah.saifullah@dfki.de" }]
dependencies = [
    # core
    "coloredlogs>=15.0.1",
    "lazy_loader>=0.4",
    "pyfiglet>=1.0.4",
    "rich>=14.0.0",
    # types
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "Pillow>=11.0.0",
    "beautifulsoup4>=4.12.2",
    "imagesize>=1.4.1",
    "pyarrow>14",
    "codename>=1.1",
    "lxml>=6.0.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.26.3",
    "pdf2image>=1.17.0",
    "pypdfium2>=4.30.0",
    "requests>=2.32.5",
    "factory-boy>=3.3.3",
    "pdfplumber>=0.11.8",
    "pytesseract>=0.3.13",
    # registry
    "pydantic>=2.0",
    # datasets
    "ray>=2.47.1",
    "deltalake>=1.0.2",
    "msgpack>=1.1.1",
    "datadings",
    "webdataset>=1.0.2",
    "datasets==5.0.1",
    "pandas>2",
    "pyarrow-hotfix>=0.7",
    "filelock>=3.18.0",
    "more-itertools>=11.1.0",
    "tqdm>=4.67.1",
    "gdown>=5.2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
test = ["pytest", "coverage"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long, handled by formatter
    "D100", "D104",  # docstring warnings
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["./src", "."]
addopts = "-rXs --strict-config --strict-markers --tb=short --import-mode=importlib"

[project.urls]
Homepage = "https://github.com/atriaml/atria_core/"
Source = "https://github.com/atriaml/atria_core/"
BugReports = "https://github.com/atriaml/atria_core/"

[tool.mypy]
ignore_missing_imports = true
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# pymupdf ships no type information, so every call into it reads as untyped.
# Scoped to that package only -- calls into everything else stay checked.
untyped_calls_exclude = ["pymupdf"]

# gdown is typed but does not re-export its public names, which strict mode's
# no_implicit_reexport rejects.
[[tool.mypy.overrides]]
module = ["gdown.*"]
implicit_reexport = true

[dependency-groups]
dev = [
    "coverage>=7.12.0",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "mypy>=1.18.2",
    "types-PyYAML>=6.0.0",
]
