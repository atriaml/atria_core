name: CI & Release

permissions:
  contents: write
  
on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - 'v*'  # releases only for tags like v1.2.3
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test.outputs.passed }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Run CI checks
        id: test
        run: |
          bash ./ci/run_checks.sh
          echo "passed=true" >> $GITHUB_OUTPUT

  create-release:
    needs: build-and-test
    if: needs.build-and-test.outputs.tests_passed == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Changes in this release
            - Auto-generated from tag ${{ github.ref_name }}
          draft: false
          prerelease: false